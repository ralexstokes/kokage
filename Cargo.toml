[workspace]
default-members = [
    "crates/kokage-derive",
    "crates/kokage",
    "crates/kokage-console",
]
members = [
    "crates/kokage-derive",
    "crates/kokage",
    "crates/kokage-console",
]
resolver = "3"

[workspace.metadata]
name = "kokage"

[workspace.dependencies]
axum = "0.8"
futures-util = "0.3"
getrandom = "0.3"
kokage = { path = "crates/kokage", version = "0.1.0" }
kokage-derive = { path = "crates/kokage-derive", version = "0.1.0" }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
metrics-util = { version = "0.20", features = ["debugging"] }
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slab = "0.4"
syn = "2.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
trybuild = "1.0"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
