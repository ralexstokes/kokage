[package]
name = "kokage-console"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Web-based dashboard for Kokage supervisor trees"
readme = "../../README.md"
keywords = ["actor", "supervisor", "console", "dashboard"]
categories = ["asynchronous", "visualization"]

[dependencies]
axum = { workspace = true, features = ["ws"] }
getrandom.workspace = true
kokage = { path = "../kokage", default-features = false, features = ["serde"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio = { workspace = true, features = ["io-util", "signal"] }
tokio-tungstenite.workspace = true
