[package]
name = "kokage"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "OTP-style supervision trees and typed actors over an async scheduler"
readme = "../../README.md"
keywords = ["actor", "supervisor", "otp", "erlang"]
categories = ["asynchronous", "concurrency"]
exclude = ["src/supervisor/tests/**"]

[features]
default = []
derive = ["dep:kokage-derive"]
host = []
metrics = ["dep:metrics"]
serde = ["dep:serde"]

[dependencies]
kokage-derive = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
slab.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "signal", "test-util"] }
tokio-util.workspace = true
tracing-subscriber.workspace = true
trybuild.workspace = true

[[example]]
name = "trading_engine"
required-features = ["derive", "metrics"]

[[example]]
name = "assistant_control_plane"
required-features = ["derive", "metrics"]

[[example]]
name = "build_farm"
required-features = ["serde"]

[[example]]
name = "shard_store"
required-features = ["serde"]

[[example]]
name = "ingest_gateway"
required-features = ["serde"]

[[example]]
name = "actor_tracing"
required-features = ["host"]

[[example]]
name = "blocking_lifecycle"
required-features = ["host"]

[[example]]
name = "blocking_work"
required-features = ["host"]

[[example]]
name = "mailbox_backpressure"
required-features = ["host"]

[[example]]
name = "ref_rebind"
required-features = ["host"]

[[example]]
name = "send_vs_try_send"
required-features = ["host"]

[[bench]]
name = "supervisor_common_flows"
harness = false
