[package]
name = "kokage"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "OTP-style supervision trees and typed actors over an async scheduler"
readme = "../../README.md"
keywords = ["actor", "supervisor", "otp", "erlang"]
categories = ["asynchronous", "concurrency"]

[features]
default = ["derive"]
derive = ["dep:kokage-derive"]
metrics = ["dep:metrics", "kokage-supervisor/metrics"]
serde = ["dep:serde", "kokage-supervisor/serde"]

[dependencies]
kokage-derive = { workspace = true, optional = true }
kokage-supervisor.workspace = true
metrics = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
futures-util.workspace = true
metrics-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "test-util"] }
tokio-util.workspace = true
tracing-subscriber.workspace = true
trybuild.workspace = true

[[example]]
name = "trading_engine"
required-features = ["metrics"]
