[package]
name = "kokage-supervisor"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Structured task supervision over an async scheduler"
readme = "../../README.md"
keywords = ["actor", "supervisor", "otp", "erlang"]
categories = ["asynchronous", "concurrency"]

[features]
metrics = ["dep:metrics"]
serde = ["dep:serde"]

[dependencies]
futures-util.workspace = true
metrics = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
slab.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "sync"] }
tracing.workspace = true

[dev-dependencies]
kokage-tokio.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-util.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
trybuild.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }
tokio-util.workspace = true

[[bench]]
name = "common_flows"
harness = false
path = "benches/common_flows.rs"
