name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select CI lane
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            full=true
            reason="push to main"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            flake.nix flake.lock nix rust-toolchain.toml; then
            full=false
            reason="ordinary pull request"
          else
            full=true
            reason="Nix or Rust toolchain change"
          fi

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "CI lane: $([[ "$full" == "true" ]] && echo full || echo fast) ($reason)" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false

      - name: Restore Cargo target cache
        if: steps.lane.outputs.full != 'true'
        uses: actions/cache@v4
        with:
          path: target
          key: cargo-target-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-target-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'rust-toolchain.toml') }}-

      - name: Validate flake
        if: steps.lane.outputs.full != 'true'
        run: nix flake check --no-build --no-update-lock-file

      - name: Run fast CI
        if: steps.lane.outputs.full != 'true'
        run: nix develop --command just ci

      - name: Run full flake checks
        if: steps.lane.outputs.full == 'true'
        run: nix flake check --no-update-lock-file
